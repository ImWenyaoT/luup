# Git hooks (lefthook)。本地检查点保持快；全量门矩阵归 CI 与 `bun run ci`。
# 安装：`bun install` 时由 lefthook 的 postinstall 自动 sync hooks。

pre-commit:
  jobs:
    # 类型检查跑全量：本仓只有一个根 program 加一个 frontend program，全量比按文件
    # 切片更快也更诚实——tsc 的错误常常出现在没改的那个文件里。
    - name: typecheck
      glob: '*.{ts,tsx}'
      run: bun run typecheck

    - name: lint (staged)
      glob: '*.{ts,tsx}'
      run: bunx oxlint --fix --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

    - name: bun:test (server)
      glob: '{src,test}/**/*.ts'
      run: bun run --filter @luup/server test

    - name: whitespace (staged)
      run: git diff --cached --check

pre-push:
  jobs:
    - name: test (full)
      run: bun run test
