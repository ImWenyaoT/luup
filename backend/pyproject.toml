[project]
name = "luup-backend"
version = "0.1.0"
description = "Luup Python Harness migration workspace"
requires-python = ">=3.12"
dependencies = [
  # app.frontend()（单进程托管前端构建产物）需要 0.141.1；官方模板取的也是这个下界
  "fastapi>=0.141.1",
  "openai-agents>=0.9.0",
  "pydantic>=2.11.0",
  # QwenSettings 读仓根 .env；已随 openai-agents 传递进 lock，提为直接依赖只是把它写实
  "pydantic-settings>=2.2.1",
]

[dependency-groups]
dev = [
  "httpx>=0.28.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.9.0",
  "ty>=0.0.69",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
