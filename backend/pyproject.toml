[project]
name = "luup-backend"
version = "0.1.0"
description = "Luup Python Harness migration workspace"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "openai-agents>=0.9.0",
  "pydantic>=2.11.0",
]

[dependency-groups]
dev = [
  "mypy>=1.15.0",
  "httpx>=0.28.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]
