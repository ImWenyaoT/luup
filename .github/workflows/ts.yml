name: TS

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 门矩阵与 `pnpm run ci` 同序
  check:
    env:
      # Next 生产构建必须显式声明 API origin；CI 使用确定性本地 API。
      LUUP_API_ORIGIN: http://127.0.0.1:8000
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: CI Gate
        run: pnpm run ci
      # 覆盖率门失败时便于对照 lcov；前置门（typecheck/lint/…）失败时目录可能不存在。
      - name: Upload coverage reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-reports
          path: |
            apps/server/coverage/
            apps/web/coverage/
          if-no-files-found: ignore
          retention-days: 7

  # 交付形态的端到端：确定性 API + Next.js 两进程，零 LLM 调用、零外部网络。
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm --filter @luup/frontend exec playwright install --with-deps chromium
      - name: Test
        # playwright.config.ts 先 build，再启动确定性 API 与 next start。
        run: pnpm run test:e2e
      - name: Upload Playwright traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces
          path: outputs/playwright/results/
          include-hidden-files: true
          retention-days: 7
