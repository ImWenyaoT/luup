name: Test Backend

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        # `uses` steps ignore defaults.run.working-directory, so the path stays repo-relative.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: backend/.python-version
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # Before upgrading uv version, make sure astral-sh/setup-uv knows its checksum.
          # See: https://github.com/astral-sh/setup-uv/issues/851#issuecomment-4282017837
          version: "0.11.18"
          working-directory: backend
      - name: Check uv.lock matches pyproject.toml
        run: uv lock --check
      - name: Test
        run: uv run pytest -q --cov=app --cov-report=term-missing --cov-fail-under=90
      - name: Lint
        run: uv run ruff check app tests scripts
      - name: Type check
        run: uv run ty check app scripts
      - name: Offline evaluation
        # `runs/` lives at the repo root; this reads committed artifacts and calls no model.
        run: uv run python -m app.evaluation --runs-root ../runs
