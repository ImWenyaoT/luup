name: Test E2E

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # E2E 打的是单进程交付形态：前端产物由 uvicorn 同端口托管，两套工具链都要装。
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: backend/.python-version
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # Before upgrading uv version, make sure astral-sh/setup-uv knows its checksum.
          # See: https://github.com/astral-sh/setup-uv/issues/851#issuecomment-4282017837
          version: "0.11.18"
          working-directory: backend
      - name: Install Bun
        # No `bun-version` input on purpose: the version comes from
        # packageManager in frontend/package.json (path is workspace-relative).
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: frontend/package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Sync backend dependencies
        # Pre-sync so the Playwright webServer only has to boot uvicorn. Same
        # UV_CACHE_DIR as playwright.config.ts, so both hit one cache.
        run: uv sync
        working-directory: backend
        env:
          UV_CACHE_DIR: .cache/uv
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      # `app.frontend()` only mounts when backend/app/frontend exists (see
      # backend/app/main.py), so the build has to land before the server boots.
      - name: Build
        run: bun run build
      - name: Test
        run: bun run test:e2e
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: frontend/playwright-report/
          include-hidden-files: true
          retention-days: 7
