name: Test Frontend

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `generate:client` re-exports the OpenAPI contract from FastAPI, so the
      # frontend job needs the backend toolchain too.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: backend/.python-version
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # Before upgrading uv version, make sure astral-sh/setup-uv knows its checksum.
          # See: https://github.com/astral-sh/setup-uv/issues/851#issuecomment-4282017837
          version: "0.11.18"
          working-directory: backend
      - name: Install Bun
        # No `bun-version` input on purpose: the version comes from
        # packageManager in frontend/package.json (path is workspace-relative).
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: frontend/package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check generated client is in sync
        run: bun run check:client
      - name: Lint
        # `bun run lint` writes fixes back; CI must only report.
        run: bun run lint:ci
      - name: Build
        run: bun run build
