packages:
  # 正常 TS 全栈形制（学 dsh：根零源码，只做 workspace 编排）：
  # 可运行产物全在 apps/* —— `@luup/server`（harness 本体）与 `@luup/frontend`（交付面）。
  # spikes/dsh（实践参考学习件，ADR-0005，原 dsh-app/）不在此列：它有自己的 workspace
  # 与 lockfile，依赖树只在进目录单独 install 时才落地，根 ci 与日常 install 不背。
  - 'apps/*'

allowBuilds:
  esbuild: true
  # lefthook 的 postinstall 只是把当前平台的二进制链到 node_modules/.bin。
  lefthook: true

minimumReleaseAgeExclude:
  - fast-xml-parser@5.10.0
  - is-unsafe@2.0.0
  - '@openai/agents@0.16.0'
  - '@openai/agents-core@0.16.0'
  - '@openai/agents-openai@0.16.0'
  - '@openai/agents-realtime@0.16.0'
