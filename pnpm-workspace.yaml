packages:
  - "apps/*"

allowBuilds:
  # esbuild 已提供平台二进制包；不运行其兜底构建脚本，并让其他依赖脚本继续 fail-closed。
  esbuild: false
  # Electron 需要 postinstall 下载平台二进制。
  electron: true
  electron-winstaller: true
  "@electron/rebuild": true
  # Astryx postinstall：写入 agent docs / 本地钩子
  "@astryxdesign/core": true
  "@astryxdesign/cli": true
